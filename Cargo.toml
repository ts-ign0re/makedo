[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
repository = "https://github.com/ts-ign0re/makedo"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
large_enum_variant = "deny"
significant_drop_tightening = "warn"
# точечные allow из pedantic — см. docs/PLAN.md §1.1
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"

[workspace.dependencies]
makedo-types = { path = "crates/makedo-types" }
makedo-config = { path = "crates/makedo-config" }
makedo-tools = { path = "crates/makedo-tools" }
makedo-wiki = { path = "crates/makedo-wiki" }
makedo-skills = { path = "crates/makedo-skills" }
makedo-providers = { path = "crates/makedo-providers" }
makedo-mcp = { path = "crates/makedo-mcp" }
makedo-session = { path = "crates/makedo-session" }
makedo-tui = { path = "crates/makedo-tui" }
makedo-memory = { path = "crates/makedo-memory" }

serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = "1"
thiserror = "2"
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "display"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "process", "io-util", "fs", "sync", "time", "signal", "net"] }
tokio-util = { version = "0.7", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
bytes = "1"
rmcp = { version = "3.1", default-features = false, features = ["client", "transport-async-rw", "transport-streamable-http-client-reqwest", "reqwest-tls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
schemars = "1"
ignore = "0.4"
globset = { version = "0.4", default-features = false }
grep-searcher = "0.1"
grep-regex = "0.1"
base64 = "0.22"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.29", default-features = false, features = ["events", "event-stream"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
ring = "0.17"
# kill(2) по группе процессов без unsafe; уже в дереве через crossterm
rustix = { version = "1", features = ["process"] }

[package]
name = "makedo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "makedo"
path = "src/main.rs"

[dependencies]
anyhow = "1"
tokio = { workspace = true }
makedo-types = { workspace = true }
makedo-session = { workspace = true }
makedo-tui = { workspace = true }
makedo-config = { workspace = true }
makedo-tools = { workspace = true }
makedo-providers = { workspace = true }
makedo-wiki = { workspace = true }
makedo-mcp = { workspace = true }
makedo-skills = { workspace = true }
makedo-memory = { workspace = true }
ignore = { workspace = true }
grep-searcher = { workspace = true }
grep-regex = { workspace = true }
base64 = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
# ponytail: оконный режим (`makedo app`) — только под фичей, CLI-бинарь и его бюджет не трогает
ratatui-wgpu = { version = "0.6", optional = true }
winit = { version = "0.30", optional = true }

[features]
gui = ["dep:ratatui-wgpu", "dep:winit"]

[lints]
workspace = true

[profile.release]
opt-level = 3
lto = "thin"

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
