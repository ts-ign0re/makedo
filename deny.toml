[licenses]
allow = ["GPL-3.0-or-later", "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "MPL-2.0", "CDLA-Permissive-2.0", "OpenSSL", "CC0-1.0"]

[advisories]
yanked = "deny"
# Оба крейта приходят только с необязательной фичей `gui` (оконный прототип) через
# ratatui-wgpu; поддерживаемой замены нет. В обычную сборку CLI они не попадают.
ignore = [
  { id = "RUSTSEC-2026-0206", reason = "rustybuzz is unmaintained; pulled only by the optional gui feature" },
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained; pulled only by the optional gui feature" },
]
