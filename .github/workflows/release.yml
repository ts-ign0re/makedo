name: Release
on:
  push:
    tags: ["v*"]
  # ручной запуск: проверочная сборка всех платформ без публикации релиза
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # статические сборки: работают на любом дистрибутиве, их ставит install.sh
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          # glibc-сборка на старом образе: нужна glibc 2.35+, а не самая свежая
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-apple-darwin, os: macos-latest }
          # Intel-раннеров macOS у GitHub больше нет — собираем кросс-компиляцией
          - { target: x86_64-apple-darwin, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: toolchain (version pinned in rust-toolchain.toml)
        run: rustup toolchain install && rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: build
        run: cargo build --locked --profile dist --target ${{ matrix.target }}
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
      - name: codesign (macOS ad-hoc, so copied binary is not SIGKILLed)
        if: contains(matrix.target, 'apple-darwin')
        run: codesign -s - -f target/${{ matrix.target }}/dist/makedo
      - name: package
        run: |
          cd target/${{ matrix.target }}/dist
          tar czf makedo-${{ matrix.target }}.tar.gz makedo
          shasum -a 256 makedo-${{ matrix.target }}.tar.gz > makedo-${{ matrix.target }}.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: makedo-${{ matrix.target }}
          path: target/${{ matrix.target }}/dist/makedo-*.tar.gz*

  # приложение для macOS: тот же TUI в собственном окне, ставится `install.sh --app`
  app:
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: toolchain (version pinned in rust-toolchain.toml)
        run: rustup toolchain install && rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: app-${{ matrix.target }}
      - name: bundle
        run: scripts/bundle-macos.sh ${{ matrix.target }}
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
      - name: package
        run: |
          cd target
          COPYFILE_DISABLE=1 tar czf Makedo-${{ matrix.target }}.app.tar.gz Makedo.app
          shasum -a 256 Makedo-${{ matrix.target }}.app.tar.gz > Makedo-${{ matrix.target }}.app.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Makedo-app-${{ matrix.target }}
          path: target/Makedo-*.app.tar.gz*

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/release-footer.md
            docs/releases
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      # текст релиза: особенности версии из docs/releases/<тег>.md (если файл есть)
      # плюс общий блок про установку и загрузки
      - name: release notes
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then cat "$notes" > body.md; fi
          sed "s/{{TAG}}/${GITHUB_REF_NAME}/g" .github/release-footer.md >> body.md
      - uses: softprops/action-gh-release@v2
        with:
          name: makedo ${{ github.ref_name }}
          body_path: body.md
          files: |
            makedo-*.tar.gz*
            Makedo-*.app.tar.gz*
          generate_release_notes: true
